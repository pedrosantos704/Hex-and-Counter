###
Test:
  test_type: data # visual | data

  Visual:
    slow: False
    print: True
    render: "interactive" 


  Data:
    Variable:
      changing_agent: 2
      changing_parameter:
        name: checkpoints #checkpoints | iterations | none
        Range:
          first: 0
          last: 256
          step: 4
    Runs:
      num_runs: 1
      num_games_per_run: 50

    Testers:
      new_testers: True
      num_testers: 4


###
Agents:

  p1_agent:
    agent_type: random

  p2_agent:
    agent_type: policy

    search_config_path: Configs/Search/Examples/SCS_example_search_config.yaml
    
    Cache:
      cache_choice: keyless
      max_size: 2000
      keep_updated: False

    Network:
      recurrent_iterations: 4
      load_checkpoint: True

      Checkpoint:
        cp_network_name: convNet
        cp_number: 2










